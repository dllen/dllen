name: Blog Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update post list
        run: |
          sleep 1m
          curl -L -o atom.xml https://scp.net.cn/blog/atom.xml
          node src/listPosts.js
          rm atom.xml
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update blog posts"
      - name: Pull changes
        run: git pull -r
      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
